apiVersion: apps/v1
kind: Deployment
metadata:
  name: vacation-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vacation-api
  template:
    metadata:
      labels:
        app: vacation-api
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox
          command: ['sh', '-c', 'until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done']
      containers:
        - name: vacation-api
          image: ghcr.io/1000bang/vacation_api:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vacation-api-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vacation-api-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vacation-api-secret
                  key: JWT_SECRET
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: ""
          resources:
            requests:
              memory: "400Mi"
              cpu: "50m"
            limits:
              memory: "900Mi"
              cpu: "500m"
